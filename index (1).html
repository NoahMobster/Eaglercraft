<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Calcz</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            width: 320px;
        }
        #display {
            width: 100%;
            height: 60px;
            background-color: #2d2d2d;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 2rem;
            text-align: right;
            padding: 0 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 20px;
            font-size: 1.25rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #3d3d3d;
            color: white;
            transition: background 0.2s;
        }
        button:hover { background-color: #4d4d4d; }
        button.operator { background-color: #ff9f0a; color: white; }
        button.operator:hover { background-color: #cc7f08; }
        button.clear { background-color: #a5a5a5; color: black; }
        button.clear:hover { background-color: #8e8e8e; }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" readonly value="0">
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="appendOperator('/')">/</button>
        <button class="operator" onclick="appendOperator('*')">*</button>
        <button class="operator" onclick="appendOperator('-')">-</button>
        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="appendOperator('+')">+</button>
        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="calculate()">=</button>
        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
        <button onclick="appendNumber('.')">.</button>
    </div>
</div>

<script>
    let display = document.getElementById('display');
    let resetOnNextInput = false;

    function appendNumber(num) {
        if (display.value === '0' || resetOnNextInput) {
            display.value = num;
            resetOnNextInput = false;
        } else {
            display.value += num;
        }
    }

    function appendOperator(op) {
        resetOnNextInput = false;
        let lastChar = display.value.slice(-1);
        if (['+','-','*','/'].includes(lastChar)) {
            display.value = display.value.slice(0, -1) + op;
        } else {
            display.value += op;
        }
    }

    function clearDisplay() {
        display.value = '0';
    }

    function calculate() {
        try {
            display.value = eval(display.value);
            resetOnNextInput = true;
        } catch (error) {
            display.value = 'Error';
            resetOnNextInput = true;
        }
    }
</script>
</body>
</html>
